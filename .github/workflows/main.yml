name: Build Windows Qt App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt and Matching MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'tools_mingw'

      - name: Configure and Build with CMake
        run: |
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package .exe and Qt DLLs
        run: |
          mkdir release_package
          copy build\Casher.exe release_package\
          windeployqt.exe release_package\Casher.exe

      - name: Upload Windows Zip
        uses: actions/upload-artifact@v4
        with:
          name: Casher-Windows
          path: release_package/
